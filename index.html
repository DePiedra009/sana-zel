<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel Sürpriz</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        h1 {
            color: #d63384;
            font-size: 2.5rem;
            margin-bottom: 10px;
            animation: fadeIn 2s ease-in-out;
            text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.6);
        }

        p {
            color: #555;
            font-size: 1.2rem;
            margin-bottom: 30px;
            animation: fadeIn 3s ease-in-out;
        }

        /* Hediye Kutusu ve Buket Alanı */
        .surprise-container {
            font-size: 100px;
            cursor: pointer;
            animation: bounce 2s infinite alternate;
            user-select: none;
            transition: transform 0.3s ease;
            min-height: 120px; /* Kutu varken de yer kaplaması için */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .surprise-container:hover {
            transform: scale(1.15);
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Buket açıldığında büyüme ve parlama efekti */
        .open-animation {
            animation: bloom 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bloom {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* Tıklayınca çıkan uçan kalpler */
        .heart {
            position: absolute;
            color: #ff3366;
            font-size: 24px;
            animation: flyUp 1.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes flyUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-200px) scale(1.8);
                opacity: 0;
            }
        }

        .footer-note {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <h1 id="title">Sana Bir Sürprizim Var 🎁</h1>
    <p id="instruction">Paketi açmak için üzerine tıkla!</p>

    <!-- Sürpriz Alanı (Başlangıçta Hediye Kutusu) -->
    <div class="surprise-container" id="giftBox" onclick="revealBouquet(event)">
        🎁
    </div>

    <div class="footer-note">Bu kodlar sadece senin için yazıldı. ❤️</div>

    <script>
        let hasOpened = false;

        function revealBouquet(event) {
            const giftBox = document.getElementById('giftBox');
            const title = document.getElementById('title');
            const instruction = document.getElementById('instruction');

            if (!hasOpened) {
                // 1. Kutu açılıyor ve buket çıkıyor
                giftBox.innerHTML = '💐';
                giftBox.classList.remove('bounce'); // Eski animasyonu kaldır
                giftBox.classList.add('open-animation'); // Yeni açılma animasyonunu ekle
                
                // 2. Yazılar değişiyor
                title.innerHTML = 'Sana Özel Hazırlandı! 💖';
                instruction.innerHTML = 'Çiçeklere dokunmaya devam et!';
                
                hasOpened = true;
            }

            // 3. Her tıklamada kalp efekti üret (İster kutuya, ister bukete tıkla)
            for (let i = 0; i < 7; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                
                // Tıklama konumuna göre rastgele saçılma
                let x = event.clientX + (Math.random() * 100 - 50);
                let y = event.clientY + (Math.random() * 50 - 25);
                
                heart.style.left = x + 'px';
                heart.style.top = y + 'px';
                
                document.body.appendChild(heart);
                
                // 1.5 saniye sonra kalbi sil
                setTimeout(() => {
                    heart.remove();
                }, 1500);
            }
        }
    </script>

</body>
</html>
