<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hediye Paketi Sürprizi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0f19; /* Lacivert tonlarında modern arka plan */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
        }

        .container {
            text-align: center;
            position: relative;
        }

        /* Hediye Paketi Stilleri */
        .gift-box {
            position: relative;
            width: 220px;
            height: 220px;
            background: linear-gradient(135deg, #e63946, #d90429); /* Kırmızı tonları */
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, opacity 1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }

        .gift-box:hover {
            transform: scale(1.05);
        }

        /* Kurdeleler (Sarı) */
        .ribbon-vertical {
            position: absolute;
            width: 40px;
            height: 100%;
            background: linear-gradient(135deg, #ffb703, #fb8500); /* Sarı-turuncu tonları */
        }

        .ribbon-horizontal {
            position: absolute;
            width: 100%;
            height: 40px;
            background: linear-gradient(135deg, #ffb703, #fb8500);
        }

        .bow {
            position: absolute;
            top: -45px;
            width: 90px;
            height: 50px;
            background: #ffb703;
            border-radius: 50% 50% 0 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .bow::before, .bow::after {
            content: '';
            position: absolute;
            top: -20px;
            width: 50px;
            height: 50px;
            border: 8px solid #fb8500;
            border-radius: 50%;
        }

        .bow::before {
            left: -35px;
            transform: rotate(-30deg);
        }

        .bow::after {
            right: -35px;
            transform: rotate(30deg);
        }

        /* Çiçek Buketi Stilleri */
        .bouquet-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 1s ease;
            pointer-events: none;
        }

        .bouquet {
            font-size: 150px; /* Büyük görünüm için */
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
        }

        .instruction {
            margin-top: 25px;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: #adb5bd;
            transition: opacity 0.5s ease;
        }

        /* Animasyon Sınıfları */
        .gift-box.open {
            transform: scale(1.5) rotate(15deg);
            opacity: 0;
        }

        .bouquet-container.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Hediye Paketi -->
        <div class="gift-box" id="giftBox" onclick="openGift()">
            <div class="bow"></div>
            <div class="ribbon-vertical"></div>
            <div class="ribbon-horizontal"></div>
        </div>

        <!-- Çiçek Buketi (Başlangıçta Gizli) -->
        <div class="bouquet-container" id="bouquetContainer">
            <div class="bouquet">💐</div>
        </div>

        <div class="instruction" id="instructionText">Hediye paketini açmak için üzerine tıklayın!</div>
    </div>

    <script>
        function openGift() {
            const giftBox = document.getElementById('giftBox');
            const bouquetContainer = document.getElementById('bouquetContainer');
            const instructionText = document.getElementById('instructionText');

            // Hediye paketini yavaşça yok et
            giftBox.classList.add('open');
            instructionText.style.opacity = '0';

            // Paket kaybolduktan sonra çiçeği ortaya çıkar
            setTimeout(() => {
                giftBox.style.display = 'none';
                bouquetContainer.classList.add('show');
                instructionText.innerText = "Sürpriz! Harika bir buket kazandınız.";
                instructionText.style.opacity = '1';
            }, 600);
        }
    </script>

</body>
</html>
