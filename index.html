<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤍 Sürpriz 🤍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0f1d 0%, #060913 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
        }

        .scene {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Hediye Paketi Tasarımı (Kırmızı ve Sarı, Kurdeleli, Büyük) */
        .gift-box {
            position: relative;
            width: 260px;
            height: 260px;
            background: linear-gradient(135deg, #ff4d4d, #cc0000);
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 77, 77, 0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s ease, visibility 0.8s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .gift-box:hover {
            transform: scale(1.08) rotate(2deg);
        }

        /* Sarı Kurdeleler */
        .ribbon-vertical {
            position: absolute;
            width: 50px;
            height: 100%;
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .ribbon-horizontal {
            position: absolute;
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        /* Büyük Fiyonk */
        .bow {
            position: absolute;
            top: -55px;
            width: 110px;
            height: 60px;
            background: #ffcc00;
            border-radius: 50% 50% 0 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            z-index: 3;
        }

        .bow::before, .bow::after {
            content: '';
            position: absolute;
            top: -25px;
            width: 65px;
            height: 65px;
            border: 10px solid #ff9900;
            border-radius: 50%;
            background: transparent;
        }

        .bow::before {
            left: -42px;
            transform: rotate(-35deg);
        }

        .bow::after {
            right: -42px;
            transform: rotate(35deg);
        }

        /* Paket Açılma Efekti (Yavaşça Kaybolma) */
        .gift-box.opening {
            transform: scale(1.4) rotate(15deg);
            opacity: 0;
            visibility: hidden;
        }

        /* Sürpriz İçerik (Çiçek Buketi Üstte, Yazı Altta) */
        .surprise-content {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.3);
            pointer-events: none;
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 1s ease;
            z-index: 1;
        }

        .surprise-content.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* Büyük Buket */
        .bouquet {
            font-size: 160px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5));
            margin-bottom: 25px;
            animation: floatBouquet 3s ease-in-out infinite alternate;
        }

        @keyframes floatBouquet {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-10px) rotate(3deg); }
        }

        /* Tebrik Mesajı */
        .message {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffc0cb;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
            letter-spacing: 1.5px;
            text-align: center;
            white-space: nowrap;
        }

        /* Alt Yönerge */
        .instruction {
            position: absolute;
            bottom: -90px;
            font-size: 1.2rem;
            color: #8c9bae;
            letter-spacing: 1px;
            transition: opacity 0.5s ease;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- Hediye Paketi (Kırmızı-Sarı, Kurdeleli ve Büyük) -->
        <div class="gift-box" id="giftBox" onclick="openPresent()">
            <div class="bow"></div>
            <div class="ribbon-vertical"></div>
            <div class="ribbon-horizontal"></div>
        </div>

        <!-- Sürpriz Çıkan Alan (Buket Üstte, Yazı Altta) -->
        <div class="surprise-content" id="surpriseContent">
            <div class="bouquet">💐</div>
            <div class="message">Dünyanın en güzel çiçeğine, kalbimden kopan küçük bir sürpriz...</div>
        </div>

        <!-- Alt Bilgilendirme -->
        <div class="instruction" id="instructionText">Paketini açmak için üzerine tıkla</div>
    </div>

    <script>
        function openPresent() {
            const giftBox = document.getElementById('giftBox');
            const surpriseContent = document.getElementById('surpriseContent');
            const instructionText = document.getElementById('instructionText');

            // Hediye paketini yavaşça açarak kaybet
            giftBox.classList.add('opening');
            instructionText.style.opacity = '0';

            // Paket tamamen kaybolduktan sonra buketin çıkmasını sağla
            setTimeout(() => {
                giftBox.style.display = 'none';
                surpriseContent.classList.add('show');
            }, 600);
        }
    </script>

</body>
</html>
