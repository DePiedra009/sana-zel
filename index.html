<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #131c31 0%, #0a0f1d 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            color: #e2e8f0;
        }

        h1 {
            font-weight: 400;
            font-size: 1.7rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: #f8fafc;
            text-align: center;
        }

        p {
            font-weight: 300;
            font-size: 0.95rem;
            color: #94a3b8;
            letter-spacing: 0.5px;
            margin-bottom: 50px;
            text-align: center;
        }

        /* Lacivert Modern Kutu Konteyneri */
        .gift-container {
            position: relative;
            cursor: pointer;
            width: 130px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .gift-container:hover {
            transform: scale(1.05);
        }

        /* Kutu Gövdesi */
        .box-body {
            position: absolute;
            bottom: 0;
            width: 120px;
            height: 95px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* Şık Gümüş Kurdele */
        .box-body::after {
            content: '';
            position: absolute;
            left: 51px;
            width: 18px;
            background: #cbd5e1;
            height: 100%;
        }

        /* Kutu Kapağı */
        .box-lid {
            position: absolute;
            top: 15px;
            width: 140px;
            height: 28px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 5px;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), top 0.6s ease;
            z-index: 10;
        }

        .box-lid::after {
            content: '';
            position: absolute;
            left: 60px;
            top: 0;
            width: 18px;
            height: 28px;
            background: #cbd5e1;
        }

        /* Kapak Açılma Animasyonu */
        .open .box-lid {
            transform: translateY(-85px) rotate(-15deg) scale(0.95);
        }

        /* Çiçek Buketi */
        .bouquet {
            position: absolute;
            bottom: 35px;
            font-size: 70px;
            transform: scale(0);
            transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
            user-select: none;
            filter: drop-shadow(0 10px 20px rgba(203, 213, 225, 0.2));
        }

        .open .bouquet {
            transform: scale(1) translateY(-30px);
        }

        /* Modern Işıltılar */
        .sparkle {
            position: absolute;
            color: #cbd5e1;
            font-size: 16px;
            animation: floatUp 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(-150px) scale(1.4);
                opacity: 0;
            }
        }

        .footer-note {
            position: absolute;
            bottom: 25px;
            font-size: 0.75rem;
            color: #64748b;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h1 id="title">Sizin İçin</h1>
    <p id="instruction">Kutuyu açmak için dokunun</p>

    <!-- Hediye Kutusu -->
    <div class="gift-container" id="giftBox" onclick="openBox(event)">
        <div class="box-lid"></div>
        <div class="box-body"></div>
        <div class="bouquet">🌹</div>
    </div>

    <div class="footer-note">Özel Tasarım</div>

    <script>
        let opened = false;

        function openBox(event) {
            const box = document.getElementById('giftBox');
            const title = document.getElementById('title');
            const instruction = document.getElementById('instruction');

            if (!opened) {
                box.classList.add('open');
                title.innerHTML = 'İyi ki Varsın';
                instruction.innerHTML = 'Keşfetmeye devam et';
                opened = true;
            }

            // Gümüş ve kırmızı zarif parıltılar
            for (let i = 0; i < 5; i++) {
                let sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.innerHTML = i % 2 === 0 ? '✨' : '🌹';
                
                let rect = box.getBoundingClientRect();
                let x = rect.left + (rect.width / 2) + (Math.random() * 80 - 40);
                let y = rect.top + (Math.random() * 40 - 20);
                
                sparkle.style.left = x + 'px';
                sparkle.style.top = y + 'px';
                
                document.body.appendChild(sparkle);
                
                setTimeout(() => {
                    sparkle.remove();
                }, 1400);
            }
        }
    </script>

</body>
</html>
