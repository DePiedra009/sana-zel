<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel Sürpriz</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        h1 {
            color: #d63384;
            font-size: 2.2rem;
            margin-bottom: 10px;
            animation: fadeIn 2s ease-in-out;
            text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.6);
        }

        p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 30px;
            animation: fadeIn 3s ease-in-out;
        }

        /* Hediye Kutusu ve Buket Alanı */
        .surprise-box {
            font-size: 90px;
            cursor: pointer;
            animation: bounce 2s infinite alternate;
            user-select: none;
            transition: transform 0.3s ease;
        }

        .surprise-box:hover {
            transform: scale(1.15);
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Çiçekler açtığında büyüme efekti */
        .open-animation {
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUp {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Uçan kalpler */
        .heart {
            position: absolute;
            color: #ff3366;
            font-size: 24px;
            animation: flyUp 1.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes flyUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-180px) scale(1.6);
                opacity: 0;
            }
        }

        .footer-note {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <h1 id="title">Sana Bir Sürprizim Var 🎁</h1>
    <p id="instruction">Paketi açmak için üzerine tıkla!</p>

    <div class="surprise-box" id="box" onclick="openBox(event)">
        🎁
    </div>

    <div class="footer-note">Bu sitenin kodları senin için yazıldı.</div>

    <script>
        let isOpen = false;

        function openBox(event) {
            let box = document.getElementById('box');
            let title = document.getElementById('title');
            let instruction = document.getElementById('instruction');

            if (!isOpen) {
                // Kutuyu aç ve buket yap
                box.innerHTML = '💐';
                box.classList.add('open-animation');
                title.innerHTML = 'Sana Özel Hazırlandı! ❤️';
                instruction.innerHTML = 'Çiçeklere dokunmaya devam et!';
                isOpen = true;
            }

            // Kalp efektleri üret
            for (let i = 0; i < 6; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                
                let rect = box.getBoundingClientRect();
                let x = rect.left + (rect.width / 2) + (Math.random() * 80 - 40);
                let y = rect.top + (Math.random() * 20 - 10);
                
                heart.style.left = x + 'px';
                heart.style.top = y + 'px';
                
                document.body.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 1500);
            }
        }
    </script>

</body>
</html>
