<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel Sürpriz</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        h1 {
            color: #d63384;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.6);
        }

        p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 50px;
        }

        /* Hediye Kutusu Konteyneri */
        .gift-container {
            position: relative;
            cursor: pointer;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kutu Gövdesi */
        .box-body {
            position: absolute;
            bottom: 0;
            width: 140px;
            height: 110px;
            background: #ff3366;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Dikey Kurdele */
        .box-body::after, .box-lid::after {
            content: '';
            position: absolute;
            left: 55px;
            width: 30px;
            background: #ffd700;
            height: 100%;
        }

        /* Kutu Kapağı */
        .box-lid {
            position: absolute;
            top: 15px;
            width: 160px;
            height: 35px;
            background: #ff1948;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.6s ease, top 0.6s ease;
            z-index: 10;
        }

        /* Kapak Açılma Animasyonu */
        .open .box-lid {
            transform: translateY(-90px) rotate(-15deg);
        }

        /* İçeriden Çıkan Buket */
        .bouquet {
            position: absolute;
            bottom: 40px;
            font-size: 80px;
            transform: scale(0);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
            user-select: none;
        }

        .open .bouquet {
            transform: scale(1) translateY(-30px);
        }

        /* Kalp Efektleri */
        .heart {
            position: absolute;
            color: #ff3366;
            font-size: 24px;
            animation: flyUp 1.2s ease-out forwards;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes flyUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-180px) scale(1.6);
                opacity: 0;
            }
        }

        .footer-note {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <h1 id="title">Sana Bir Sürprizim Var 🎁</h1>
    <p id="instruction">Kutuyu açmak için üzerine dokun!</p>

    <!-- Hediye Kutusu -->
    <div class="gift-container" id="giftBox" onclick="openBox(event)">
        <div class="box-lid"></div>
        <div class="box-body"></div>
        <div class="bouquet">💐</div>
    </div>

    <div class="footer-note">Bu sitenin kodları senin için yazıldı. ❤️</div>

    <script>
        let opened = false;

        function openBox(event) {
            const box = document.getElementById('giftBox');
            const title = document.getElementById('title');
            const instruction = document.getElementById('instruction');

            if (!opened) {
                box.classList.add('open');
                title.innerHTML = 'Sana Özel Hazırlandı! 💖';
                instruction.innerHTML = 'Çiçeklere dokunmaya devam et!';
                opened = true;
            }

            // Tıklayınca kalpler fırlat
            for (let i = 0; i < 6; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                
                let rect = box.getBoundingClientRect();
                let x = rect.left + (rect.width / 2) + (Math.random() * 80 - 40);
                let y = rect.top + (Math.random() * 40 - 20);
                
                heart.style.left = x + 'px';
                heart.style.top = y + 'px';
                
                document.body.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 1200);
            }
        }
    </script>

</body>
</html>
