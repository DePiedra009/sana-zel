<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Hediye Deneyimi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1329; /* Derin Lacivert Arka Plan */
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 30%, #17244a 0%, #0b1329 80%);
        }

        header {
            position: absolute;
            top: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #e2e8f0;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
        }

        .container {
            position: relative;
            width: 380px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Daha Büyük Kırmızı-Sarı Hediye Paketi Tasarımı */
        .gift-box {
            position: absolute;
            width: 240px;
            height: 240px;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(253, 224, 71, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.9s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid rgba(253, 224, 71, 0.4);
        }

        /* Sarı (Altın) Kurdeleler */
        .gift-box::before {
            content: '';
            position: absolute;
            width: 40px;
            height: 100%;
            background: linear-gradient(to right, #eab308, #fef08a, #eab308);
        }

        .gift-box::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 40px;
            background: linear-gradient(to bottom, #eab308, #fef08a, #eab308);
        }

        .ribbon-bow {
            position: absolute;
            top: -35px;
            width: 80px;
            height: 40px;
            background: #eab308;
            border-radius: 50% 50% 0 0;
            box-shadow: 0 8px 15px rgba(0,0,0,0.4);
        }

        /* Ortaya Çıkacak Buket Alanı */
        .bouquet {
            position: absolute;
            opacity: 0;
            transform: scale(0.4) translateY(40px);
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            pointer-events: none;
        }

        .bouquet-icon {
            font-size: 120px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
            animation: floatBouquet 3s ease-in-out infinite alternate;
        }

        @keyframes floatBouquet {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        .bouquet-text {
            margin-top: 15px;
            font-size: 1.4rem;
            color: #fef08a;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
            font-weight: 500;
        }

        /* Açılma / Yok Olma Animasyon Sınıfları */
        .container.open .gift-box {
            transform: scale(1.4) rotate(15deg);
            opacity: 0;
            filter: blur(12px);
        }

        .container.open .bouquet {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .instruction {
            position: absolute;
            bottom: 50px;
            font-size: 1rem;
            color: #94a3b8;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Özel Bir Hediye</h1>
        <p class="subtitle">Sizi Bekliyor</p>
    </header>

    <div class="container" id="giftContainer" onclick="openGift()">
        <!-- Kırmızı & Sarı Hediye Kutusu -->
        <div class="gift-box" id="giftBox">
            <div class="ribbon-bow"></div>
        </div>

        <!-- Çiçek Buketi -->
        <div class="bouquet" id="bouquet">
            <div class="bouquet-icon">💐</div>
            <div class="bouquet-text">Sürpriz Buketiniz!</div>
        </div>
    </div>

    <div class="instruction">Paketi açmak için üzerine tıklayın</div>

    <script>
        function openGift() {
            const container = document.getElementById('giftContainer');
            const instruction = document.querySelector('.instruction');
            
            if (!container.classList.contains('open')) {
                container.classList.add('open');
                instruction.style.opacity = '0';
            }
        }
    </script>
</body>
</html>
