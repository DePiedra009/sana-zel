<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #030712 0%, #0f172a 50%, #1e1b4b 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            color: #f8fafc;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-weight: 300;
            font-size: 1.6rem;
            letter-spacing: 3px;
            margin-bottom: 6px;
            color: #f1f5f9;
        }

        p {
            font-weight: 300;
            font-size: 0.9rem;
            color: #94a3b8;
            letter-spacing: 1px;
            margin-bottom: 50px;
        }

        /* Modern Kutu Kutusu */
        .gift-box-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .gift-box-wrapper:hover {
            transform: scale(1.06);
        }

        /* Kutu Alt Gövde */
        .box-base {
            position: absolute;
            bottom: 0;
            width: 110px;
            height: 85px;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0 0 8px 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        /* Kurdele Detayı */
        .box-base::after, .box-top::after {
            content: '';
            position: absolute;
            left: 47px;
            width: 16px;
            background: #e2e8f0;
            height: 100%;
        }

        /* Kutu Kapağı */
        .box-top {
            position: absolute;
            top: 20px;
            width: 126px;
            height: 26px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
        }

        .box-top::after {
            top: 0;
        }

        /* Açılma Animasyonu */
        .opened .box-top {
            transform: translateY(-90px) rotate(-18deg) scale(0.9);
        }

        /* İçeriden Çıkan Buket */
        .bouquet-output {
            position: absolute;
            bottom: 30px;
            font-size: 65px;
            transform: scale(0);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
            user-select: none;
            filter: drop-shadow(0 10px 20px rgba(226, 232, 240, 0.2));
        }

        .opened .bouquet-output {
            transform: scale(1) translateY(-35px);
        }

        /* Işıltı Efekti */
        .particle {
            position: absolute;
            font-size: 16px;
            animation: riseUp 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes riseUp {
            0% {
                transform: translateY(0) scale(0.6);
                opacity: 1;
            }
            100% {
                transform: translateY(-170px) scale(1.3);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="mainTitle">Özel Bir An</h1>
        <p id="subTitle">Devam etmek için kutuya dokunun</p>

        <!-- Kutu -->
        <div class="gift-box-wrapper" id="boxElement" onclick="triggerOpen(event)">
            <div class="box-top"></div>
            <div class="box-base"></div>
            <div class="bouquet-output">💐</div>
        </div>
    </div>

    <script>
        let isOpened = false;

        function triggerOpen(e) {
            const wrapper = document.getElementById('boxElement');
            const mainTitle = document.getElementById('mainTitle');
            const subTitle = document.getElementById('subTitle');

            if (!isOpened) {
                wrapper.classList.add('opened');
                mainTitle.innerText = "İyi ki Varsın";
                subTitle.innerText = "Sana özel hazırlandı";
                isOpened = true;
            }

            // Etrafa yayılan zarif parıltılar
            for (let i = 0; i < 6; i++) {
                let p = document.createElement('div');
                p.className = 'particle';
                p.innerHTML = i % 2 === 0 ? '✨' : '🌹';
                
                let rect = wrapper.getBoundingClientRect();
                let x = rect.left + (rect.width / 2) + (Math.random() * 80 - 40);
                let y = rect.top + (Math.random() * 30 - 15);
                
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1500);
            }
        }
    </script>

</body>
</html>
