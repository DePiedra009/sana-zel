<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Hediye Deneyimi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1329; /* Derin Lacivert */
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 30%, #17244a 0%, #0b1329 80%);
        }

        header {
            position: absolute;
            top: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #e2e8f0;
        }

        p.subtitle {
            font-size: 1rem;
            color: #94a3b8;
        }

        .container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Hediye Paketi Tasarımı */
        .gift-box {
            position: absolute;
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(212, 175, 55, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* Kurdeleler */
        .gift-box::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 100%;
            background: linear-gradient(to right, #d4af37, #f3e5ab, #d4af37);
        }

        .gift-box::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 30px;
            background: linear-gradient(to bottom, #d4af37, #f3e5ab, #d4af37);
        }

        .ribbon-bow {
            position: absolute;
            top: -25px;
            width: 60px;
            height: 30px;
            background: #d4af37;
            border-radius: 50% 50% 0 0;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }

        /* Buket Alanı */
        .bouquet {
            position: absolute;
            opacity: 0;
            transform: scale(0.5) translateY(30px);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            pointer-events: none;
        }

        .bouquet img {
            width: 220px;
            height: 220px;
            object-fit: contain;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
        }

        .bouquet-text {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #f3e5ab;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Animasyon Sınıfları */
        .container.open .gift-box {
            transform: scale(1.3) rotate(10deg);
            opacity: 0;
            filter: blur(10px);
        }

        .container.open .bouquet {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .instruction {
            position: absolute;
            bottom: 50px;
            font-size: 0.9rem;
            color: #64748b;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Özel Bir Hediye</h1>
        <p class="subtitle">Sizi Bekliyor</p>
    </header>

    <div class="container" id="giftContainer" onclick="openGift()">
        <!-- Hediye Kutusu -->
        <div class="gift-box" id="giftBox">
            <div class="ribbon-bow"></div>
        </div>

        <!-- Çıkan Buket (Görsel yerine şık bir simge/ikon veya emoji grubu da kullanılabilir) -->
        <div class="bouquet" id="bouquet">
            <div style="font-size: 90px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));">💐</div>
            <div class="bouquet-text">Sürpriziniz Keşfedildi!</div>
        </div>
    </div>

    <div class="instruction">Paketi açmak için üzerine tıklayın</div>

    <script>
        function openGift() {
            const container = document.getElementById('giftContainer');
            const instruction = document.querySelector('.instruction');
            
            // Tıklandığında sınıfı ekle ve animasyonu başlat
            if (!container.classList.contains('open')) {
                container.classList.add('open');
                instruction.style.opacity = '0';
            }
        }
    </script>
</body>
</html>
