<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel Dijital Buket</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        h1 {
            color: #d63384;
            font-size: 2.5rem;
            margin-bottom: 10px;
            animation: fadeIn 2s ease-in-out;
            text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.6);
        }

        p {
            color: #555;
            font-size: 1.2rem;
            margin-bottom: 30px;
            animation: fadeIn 3s ease-in-out;
        }

        /* Buket Alanı ve Animasyonlar */
        .bouquet-container {
            font-size: 80px;
            cursor: pointer;
            animation: bounce 2s infinite alternate;
            user-select: none;
            transition: transform 0.2s;
        }

        .bouquet-container:hover {
            transform: scale(1.1);
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tıklayınca çıkan uçan kalpler */
        .heart {
            position: absolute;
            color: #ff3366;
            font-size: 24px;
            animation: flyUp 1.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes flyUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-150px) scale(1.5);
                opacity: 0;
            }
        }

        .footer-note {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <h1>Sana Özel Hazırlandı 💐</h1>
    <p>Çiçeklere dokun ve kalpleri gör! ❤️</p>

    <!-- Animasyonlu Buket -->
    <div class="bouquet-container" onclick="createHeart(event)">
        💐
    </div>

    <div class="footer-note">Bu sitenin kodları senin için yazıldı.</div>

    <script>
        function createHeart(event) {
            // Tıklanan yere kalp efekti ekleme
            for (let i = 0; i < 5; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                
                // Fare pozisyonuna göre rastgele yönlendirme
                let x = event.clientX + (Math.random() * 60 - 30);
                let y = event.clientY + (Math.random() * 20 - 10);
                
                heart.style.left = x + 'px';
                heart.style.top = y + 'px';
                
                document.body.appendChild(heart);
                
                // 1.5 saniye sonra kalbi sil
                setTimeout(() => {
                    heart.remove();
                }, 1500);
            }
        }
    </script>

</body>
</html>
